[package]
name = "flyvista"
version = "0.1.0-alpha.0"
description = "Interactive desktop atlas for the adult Drosophila brain"
authors = ["FlyVista contributors"]
license = "Apache-2.0"
repository = "https://github.com/wizardlouis/flyvista-brain-atlas"
edition = "2024"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "flyvista_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
